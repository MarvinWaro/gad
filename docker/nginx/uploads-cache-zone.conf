# Where Nginx keeps the uploads it has handed out from the bucket
# (uploads-cache.conf). Inside the container, so a redeploy starts it empty.
# A photo nobody asks for in 7 days leaves it; it never grows past 1 GB.
fastcgi_cache_path /tmp/nginx-uploads levels=1:2 keys_zone=uploads:10m max_size=1g inactive=7d use_temp_path=off;
