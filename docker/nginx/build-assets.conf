# Vite's hashed module and WebAssembly files (the PDF worker, the PDF image
# decoders and the QR reader) never change under one name, so browsers keep
# them for a year, as the image already does for .js and .css.
location ~* ^/build/.+\.(?:mjs|wasm)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}
