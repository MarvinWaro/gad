# Public uploads from a private bucket go out through Laravel at /files/...
# (PublicUploadController). Nginx keeps each one it hands out, so PHP and
# the bucket are asked once per photo, not once per visitor. Every upload
# has its own random name, so a kept copy never goes stale. Only answers
# that worked are kept; a removed photo leaves after 7 days unasked.
# `^~` puts this ahead of the image's rule for .jpg, .png and .webp files.
location ^~ /files/ {
    access_log off;

    fastcgi_cache uploads;
    fastcgi_cache_key $request_uri;
    fastcgi_cache_valid 200 7d;
    fastcgi_cache_lock on;
    fastcgi_cache_use_stale error timeout updating;
    add_header X-Upload-Cache $upstream_cache_status;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass 127.0.0.1:9000;
}
